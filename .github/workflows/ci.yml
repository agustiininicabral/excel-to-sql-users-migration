name: Validate migration project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: excel_migration
      DB_USER: root
      DB_PASSWORD: root
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate sample workbook
        run: python scripts/generate_sample_workbook.py
      - name: Run automated tests
        run: pytest
      - name: Run migration dry-run
        run: python -m migration.main --dry-run --input data/source/users_source.xlsx
      - name: Apply MySQL 8.0 schema
        run: python scripts/apply_schema.py
      - name: Execute real MySQL migration
        run: python -m migration.main --input data/source/users_source.xlsx
      - name: Verify persisted MySQL records
        run: python scripts/verify_database.py
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-migration-validation
          path: |
            reports/*.csv
            data/source/users_source.xlsx
          if-no-files-found: warn
