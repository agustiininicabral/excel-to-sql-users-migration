name: Validate migration project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate sample Excel workbook
        run: python scripts/generate_sample_workbook.py
      - name: Run tests
        run: pytest
      - name: Run migration dry-run
        run: python -m migration.main --dry-run --input data/source/users_source.xlsx
        env:
          PYTHONPATH: src
